name: Staging end-to-end tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright against staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: npm

      - name: Verify staging configuration
        shell: bash
        run: |
          test -n "$PLAYWRIGHT_BASE_URL" || {
            echo "Configure the STAGING_BASE_URL environment variable in the staging environment."
            exit 1
          }

      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
