server {
    listen 80;
    listen [::]:80;
    server_name hs6tools.com www.hs6tools.com;
    access_log /var/log/nginx/hs6tools-access.log hs6tools_privacy;
    error_log /var/log/nginx/hs6tools-error.log crit;
    return 301 https://hs6tools.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hs6tools.com www.hs6tools.com;

    ssl_certificate /etc/letsencrypt/live/hs6tools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hs6tools.com/privkey.pem;
    access_log /var/log/nginx/hs6tools-access.log hs6tools_privacy;
    error_log /var/log/nginx/hs6tools-error.log crit;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /api/auth/verify-phone/ {
        limit_req zone=hs6_verify burst=3 nodelay;
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    location ^~ /api/auth/reset-password/ {
        limit_req zone=hs6_verify burst=3 nodelay;
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    location ~ ^/api/auth/(?:callback/credentials|signin/credentials|register)$ {
        limit_req zone=hs6_auth burst=5 nodelay;
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    location = /api/customer/security/password {
        limit_req zone=hs6_auth burst=5 nodelay;
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    # Session refresh, CSRF, and provider discovery are routine storefront traffic.
    location /api/auth/ {
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    location ^~ /api/admin/ {
        limit_req zone=hs6_admin burst=20 nodelay;
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    location ~ ^/api/(?:users|settings|analytics|crm|orders)(?:/|$) {
        limit_req zone=hs6_admin burst=20 nodelay;
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    # These APIs also serve storefront GETs. An empty zone key leaves reads
    # unlimited while rate-limiting Admin mutations.
    location ~ ^/api/(?:products|categories|content|coupons|education)(?:/|$) {
        limit_req zone=hs6_admin_writes burst=20 nodelay;
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    location ~ ^/(?:fa|en|ar)/admin(?:/|$) {
        limit_req zone=hs6_admin burst=20 nodelay;
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    location ~ ^/api/(?:sms|upload|payment/zarinpal/request)(?:/|$) {
        limit_req zone=hs6_abuse burst=10 nodelay;
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }

    # Normal storefront navigation is intentionally not rate-limited here.
    location / {
        include /etc/nginx/snippets/hs6tools-proxy.conf;
    }
}
