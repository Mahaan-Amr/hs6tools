# Loaded in nginx's http context.
limit_req_zone $binary_remote_addr zone=hs6_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hs6_verify:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=hs6_admin:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=hs6_abuse:10m rate=20r/m;

map $request_method $hs6_admin_write_client {
    default '';
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}

limit_req_zone $hs6_admin_write_client zone=hs6_admin_writes:10m rate=60r/m;

limit_req_status 429;
limit_req_log_level notice;

# Intentionally excludes paths, query strings, client IPs, referrers, user agents,
# Authorization, and Cookie headers. Application output is separately redacted.
log_format hs6tools_privacy '$time_iso8601 request_id=$request_id '
                            'method=$request_method status=$status '
                            'bytes=$body_bytes_sent duration=$request_time';

upstream hs6tools_runtime {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
